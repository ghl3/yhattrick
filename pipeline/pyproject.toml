[project]
name = "yhattrick"
version = "0.1.0"
description = "NHL Wins Above Replacement pipeline: per-shot xG, RAPM, and player value modeling with an inspection website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.36",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "xgboost>=2.1.0",
]

[project.scripts]
yhattrick-fetch = "yhattrick.download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yhattrick"]
