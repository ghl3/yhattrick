[project]
name = "yhattrick"
version = "0.1.0"
description = "NHL Wins Above Replacement pipeline: per-shot xG, RAPM, and player value modeling with an inspection website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.36",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "xgboost>=2.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
yhattrick-fetch = "yhattrick.data.download:main"

[dependency-groups]
dev = ["pytest>=8", "black>=24"]
# experimental: the generative (Poisson) proof-of-concept model only (models/generative_model.py).
# Kept out of the core pipeline deps so JAX isn't required for the production build.
experimental = ["jax>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yhattrick"]
