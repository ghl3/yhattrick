<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="yHatTrick">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#2f6cb0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#g)"/>
  <!-- the "hat" of y-hat (the regression prediction) -->
  <polyline points="33,43 50,28 67,43" fill="none" stroke="#ffffff" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the y -->
  <text x="50" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#ffffff">y</text>
</svg>
